[package]
name = "a1slice"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A1 Slice desktop app"

[dependencies]
a1slice-core = { path = "../a1slice-core" }
eframe = { version = "0.32", default-features = true }
egui = "0.32"
rfd = "0.15"
serde_json = "1"
video-rs = "0.12.0"
ffmpeg-next = { version = "9.0.0", features = ["non-exhaustive-enums"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

