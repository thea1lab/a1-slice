name: Build whisper-cli binaries

on:
  workflow_dispatch:
    inputs:
      whisper_ref:
        description: "whisper.cpp git tag or commit to build from"
        required: true
        default: "v1.8.3"
      release_tag:
        description: "GitHub release tag to upload binaries to (must match WHISPER_BINARY_VERSION in whisper.ts)"
        required: true
        default: "whisper-v1.0.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
            binary_name: whisper-cli-linux-x64
            cmake_extra: ""
          - target: mac-arm64
            runner: macos-14
            binary_name: whisper-cli-mac-arm64
            cmake_extra: "-DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON"
          - target: mac-x64
            runner: macos-13
            binary_name: whisper-cli-mac-x64
            cmake_extra: "-DGGML_METAL=OFF"
          - target: win-x64
            runner: windows-latest
            binary_name: whisper-cli-win-x64.exe
            cmake_extra: "-A x64"

    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.target }}

    steps:
      - name: Checkout whisper.cpp
        uses: actions/checkout@v4
        with:
          repository: ggerganov/whisper.cpp
          ref: ${{ inputs.whisper_ref }}

      - name: Configure CMake (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_SERVER=OFF \
            -DWHISPER_SDL2=OFF \
            -DWHISPER_CURL=OFF \
            -DWHISPER_FFMPEG=OFF \
            ${{ matrix.cmake_extra }}

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=OFF `
            -DGGML_NATIVE=OFF `
            -DWHISPER_BUILD_TESTS=OFF `
            -DWHISPER_BUILD_SERVER=OFF `
            -DWHISPER_SDL2=OFF `
            -DWHISPER_CURL=OFF `
            -DWHISPER_FFMPEG=OFF `
            ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --config Release -j $(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 2)
        shell: bash

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp build/bin/whisper-cli "${{ matrix.binary_name }}"
          chmod +x "${{ matrix.binary_name }}"

      - name: Codesign (macOS)
        if: runner.os == 'macOS'
        run: codesign --sign - --force "${{ matrix.binary_name }}"

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp build/bin/Release/whisper-cli.exe "${{ matrix.binary_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.binary_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "Whisper CLI (${{ inputs.release_tag }})"
          body: |
            Pre-built whisper-cli binaries (whisper.cpp @ `${{ inputs.whisper_ref }}`).

            These are consumed automatically by the A1 Slice app.
          files: artifacts/*
          fail_on_unmatched_files: true
