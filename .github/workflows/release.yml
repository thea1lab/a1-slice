name: Release

on:
  push:
    branches: [main]
    paths: [package.json]

env:
  WHISPER_TAG: v1.8.3

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if version changed
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${VERSION} already exists — skipping release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New version v${VERSION} detected — will release."
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: macos-latest
    name: Build (macOS)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --- Whisper binary cache ---
      - name: Cache whisper-cli binaries
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: resources/bin
          key: whisper-${{ env.WHISPER_TAG }}-macOS

      # --- Build whisper (only on cache miss) ---
      - name: Clone whisper.cpp
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch ${{ env.WHISPER_TAG }} https://github.com/ggerganov/whisper.cpp.git

      - name: Build whisper-cli (CPU)
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S whisper.cpp -B whisper.cpp/build-cpu \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGML_METAL=OFF
          cmake --build whisper.cpp/build-cpu --config Release --target whisper-cli --parallel

      - name: Build whisper-cli (GPU, Metal)
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S whisper.cpp -B whisper.cpp/build-gpu \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build whisper.cpp/build-gpu --config Release --target whisper-cli --parallel

      - name: Copy whisper-cli binaries
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p resources/bin
          cp whisper.cpp/build-cpu/bin/whisper-cli resources/bin/whisper-cli-mac-arm64
          cp whisper.cpp/build-gpu/bin/whisper-cli resources/bin/whisper-cli-mac-arm64-gpu
          chmod +x resources/bin/whisper-cli-mac-arm64 resources/bin/whisper-cli-mac-arm64-gpu

      # --- Package & upload ---
      - name: Build & package
        run: npm run dist:mac -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: "release/*.dmg"
          if-no-files-found: error

  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          name: "A1 Slice ${{ needs.check-version.outputs.version }}"
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
