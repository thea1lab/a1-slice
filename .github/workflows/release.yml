name: Release

on:
  push:
    branches: [main]
    paths: [package.json]

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if version changed
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${VERSION} already exists — skipping release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New version v${VERSION} detected — will release."
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
            artifact_glob: "release/*.AppImage"
            artifact_name: linux
          - os: windows-latest
            script: dist:win
            artifact_glob: "release/*.exe"
            artifact_name: windows
          - os: macos-latest
            script: dist:mac
            artifact_glob: "release/*.dmg"
            artifact_name: macos

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install CUDA toolkit (Linux)
        if: runner.os == 'Linux'
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: '12.6.3'

      - name: Install CUDA toolkit (Windows)
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: '12.6.3'

      - name: Clone whisper.cpp
        shell: bash
        run: git clone --depth 1 --branch v1.8.3 https://github.com/ggerganov/whisper.cpp.git

      # --- CPU build (GPU explicitly disabled) ---
      - name: Build whisper-cli (CPU)
        shell: bash
        run: |
          cmake -S whisper.cpp -B whisper.cpp/build-cpu \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGML_METAL=OFF -DGGML_CUDA=OFF
          cmake --build whisper.cpp/build-cpu --config Release --target whisper-cli --parallel

      # --- GPU build ---
      - name: Build whisper-cli (GPU, Metal — macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -S whisper.cpp -B whisper.cpp/build-gpu \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build whisper.cpp/build-gpu --config Release --target whisper-cli --parallel

      - name: Build whisper-cli (GPU, CUDA — Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S whisper.cpp -B whisper.cpp/build-gpu \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES="75;80;86;89;90"
          cmake --build whisper.cpp/build-gpu --config Release --target whisper-cli --parallel

      - name: Build whisper-cli (GPU, CUDA — Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -S whisper.cpp -B whisper.cpp/build-gpu \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES="75;80;86;89;90"
          cmake --build whisper.cpp/build-gpu --config Release --target whisper-cli --parallel

      # --- Copy binaries ---
      - name: Copy whisper-cli binaries (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p resources/bin
          cp whisper.cpp/build-cpu/bin/whisper-cli resources/bin/whisper-cli-linux-x64
          cp whisper.cpp/build-gpu/bin/whisper-cli resources/bin/whisper-cli-linux-x64-gpu
          chmod +x resources/bin/whisper-cli-linux-x64 resources/bin/whisper-cli-linux-x64-gpu

      - name: Copy whisper-cli binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources\bin
          Copy-Item whisper.cpp\build-cpu\bin\Release\whisper-cli.exe resources\bin\whisper-cli-win-x64.exe
          Copy-Item whisper.cpp\build-gpu\bin\Release\whisper-cli.exe resources\bin\whisper-cli-win-x64-gpu.exe

      - name: Copy whisper-cli binaries (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p resources/bin
          cp whisper.cpp/build-cpu/bin/whisper-cli resources/bin/whisper-cli-mac-arm64
          cp whisper.cpp/build-gpu/bin/whisper-cli resources/bin/whisper-cli-mac-arm64-gpu
          chmod +x resources/bin/whisper-cli-mac-arm64 resources/bin/whisper-cli-mac-arm64-gpu

      - name: Build & package
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          name: "A1 Slice ${{ needs.check-version.outputs.version }}"
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
